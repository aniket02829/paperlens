services:
  - type: web
    name: paperlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: CROSSREF_EMAIL
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
